<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大學生個人自我介紹</title>
    <style>
        /* CSS 樣式設定 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #bec6ce, #c2a62c);
            color: #333;
            min-height: 100vh;
            position: relative;
        }

        /* 整個網站右上角的頁籤切換按鈕 */
        .tab-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .tab-btn {
            background-color: #0984e3;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: background 0.3s;
        }

        .tab-btn:hover:not(:disabled) {
            background-color: #74b9ff;
        }

        .tab-btn:disabled {
            background-color: #0984e3;
            cursor: not-allowed;
            opacity: 0.8;
        }

        /* 使用 Flexbox 排版的主要容器，設定間距為 10cm */
        .main-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            gap: 10cm; /* 設定每隔 10cm 的間距 */
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            text-align: center;
            padding: 40px 30px;
        }

        /* 內容區塊預設隱藏 */
        .tab-content {
            display: none;
        }

        /* 當內容區塊啟用時顯示 */
        .tab-content.active {
            display: block;
        }

        /* 大頭貼照樣式 */
        .photo-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #74b9ff;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 姓名、標題 */
        h1 {
            font-size: 28px;
            color: #2d3436;
            margin-bottom: 10px;
        }

        /* 班級與座號標籤 */
        .info-badges {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .badge {
            background-color: #dfe6e9;
            color: #636e72;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .badge.highlight {
            background-color: #ffeaa7;
            color: #d63031;
        }

        /* 自我介紹內文 */
        .bio {
            font-size: 15px;
            line-height: 1.6;
            color: #636e72;
            text-align: left;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .bio h3 {
            color: #2d3436;
            margin-bottom: 8px;
            font-size: 16px;
        }

        /* 聯絡方式 / 社群按鈕 */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-links a {
            text-decoration: none;
            background-color: #0984e3;
            color: white;
            padding: 8px 20px;
            border-radius: 5px;
            font-size: 14px;
            transition: background 0.3s;
        }

        .social-links a:hover {
            background-color: #74b9ff;
        }

        /* 響應式網頁設計 (RWD)：當螢幕寬度小於 768px（手機與平版）時調整間距 */
        @media (max-width: 768px) {
            .main-container {
                gap: 2rem; /* 在小螢幕上自動縮小間距，避免破版 */
                padding-top: 80px; /* 避免右上角按鈕遮擋內容 */
            }
        }
    </style>
</head>
<body>

    <!-- 整個網站右上角的頁籤切換按鈕 -->
    <div class="tab-buttons">
        <button class="tab-btn" id="btn-bio" onclick="switchTab('bio')" disabled>自我介紹</button>
        <button class="tab-btn" id="btn-contact" onclick="switchTab('contact')">聯絡我</button>
    </div>

    <!-- Flexbox 主容器 -->
    <div class="main-container">
        <div class="card">
            <!-- 區塊 1：自我介紹 -->
            <div id="content-bio" class="tab-content active">
                <div class="photo-container">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80" alt="個人照">
                </div>
                <h1>xxx</h1>
                <div class="info-badges">
                    <span class="badge">資訊管理系 資訊二甲</span>
                    <span class="badge highlight">學號:3B4320xx</span>
                </div>
                <div class="bio">
                    <h3>👋 關於我</h3>
                    <p>嗨！我是xxx，目前就讀於大學。個性外向、喜歡交朋友，對網頁前端開發與設計很有熱忱。課餘時間喜歡打籃球、聽音樂以及探索各種新科技產品！</p>
                </div>
            </div>

            <!-- 區塊 2：聯絡我 -->
            <div id="content-contact" class="tab-content">
                <div class="bio" style="text-align: center;">
                    <h3>📞 與我聯繫</h3>
                    <p style="margin-bottom: 20px;">如果你對我的作品有興趣或想進一步交流，歡迎透過以下方式找到我！</p>
                    <div class="social-links">
                        <a href="mailto:your_email@example.com">聯絡信箱</a>
                        <a href="https://github.com" target="_blank">GitHub</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            const btnBio = document.getElementById('btn-bio');
            const btnContact = document.getElementById('btn-contact');
            const contentBio = document.getElementById('content-bio');
            const contentContact = document.getElementById('content-contact');

            if (tabName === 'bio') {
                contentBio.classList.add('active');
                contentContact.classList.remove('active');
                btnBio.disabled = true;
                btnContact.disabled = false;
            } else if (tabName === 'contact') {
                contentContact.classList.add('active');
                contentBio.classList.remove('active');
                btnContact.disabled = true;
                btnBio.disabled = false;
            }
        }
    </script>

</body>
</html>
