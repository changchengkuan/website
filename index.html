<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大學生個人自我介紹</title>
    <style>
        /* CSS 樣式設定 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #bec6ce, #c2a62c);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            text-align: center;
            padding: 40px 30px;
            margin: 20px;
        }

        /* 大頭貼照樣式 */
        .photo-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #74b9ff;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 姓名、標題 */
        h1 {
            font-size: 28px;
            color: #2d3436;
            margin-bottom: 10px;
        }

        /* 班級與座號標籤 */
        .info-badges {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .badge {
            background-color: #dfe6e9;
            color: #636e72;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .badge.highlight {
            background-color: #ffeaa7;
            color: #d63031;
        }

        /* 自我介紹內文 */
        .bio {
            font-size: 15px;
            line-height: 1.6;
            color: #636e72;
            text-align: left;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .bio h3 {
            color: #2d3436;
            margin-bottom: 8px;
            font-size: 16px;
        }

        /* 社群連結按鈕 */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-links a {
            text-decoration: none;
            background-color: #0984e3;
            color: white;
            padding: 8px 20px;
            border-radius: 5px;
            font-size: 14px;
            transition: background 0.3s;
        }

        .social-links a:hover {
            background-color: #74b9ff;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 個人照 (請將 src 替換為你的圖片網址或本地圖片檔名) -->
        <div class="photo-container">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80" alt="個人照">
        </div>

        <!-- 姓名 -->
        <h1>xxx</h1>

        <!-- 班級與座號 -->
        <div class="info-badges">
            <span class="badge">資訊管理系 資訊二甲</span>
            <span class="badge highlight">學號:3B4320xx</span>
        </div>

        <!-- 個人簡介區塊 -->
        <div class="bio">
            <h3>👋 關於我</h3>
            <p>嗨！我是xxx，目前就讀於大學。個性外向、喜歡交朋友，對網頁前端開發與設計很有熱忱。課餘時間喜歡打籃球、聽音樂以及探索各種新科技產品！</p>
        </div>

        <!-- 聯絡方式 / 社群按鈕 -->
        <div class="social-links">
            <a href="mailto:your_email@example.com">聯絡信箱</a>
            <a href="https://github.com" target="_blank">GitHub</a>
        </div>
    </div>

</body>
</html>
